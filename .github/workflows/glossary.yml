name: Deploy glossary site

# Build a dedicated SPA from this repo's docs/glossary.md and publish it
# to https://akira-toriyama.github.io/wand/.
# The substance (builder + viewer) is delegated to akira-toriyama/glossary-site's
# reusable workflow.
#
# - push to main → build + deploy
# - pull_request → build only (inspect the artifact; no deploy)
# - workflow_dispatch → build + deploy

on:
  push:
    branches: [main]
    paths:
      - docs/glossary.md
      - .github/workflows/glossary.yml
  pull_request:
    paths:
      - docs/glossary.md
      - .github/workflows/glossary.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Separate groups for PRs and main (a PR build never drags down a main deploy)
  group: pages-${{ github.event.number || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: akira-toriyama/glossary-site/.github/workflows/deploy.yml@main
